# nginx site for Umami on the vaultwarden Linode.
# Install to /etc/nginx/sites-available/analytics.fossunited.org then symlink into
# sites-enabled. TLS added by certbot (see README).

server {
    server_name analytics.fossunited.org;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
