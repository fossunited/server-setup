# Umami web analytics. Runs on the vaultwarden Linode.
# Reverse proxy on this host is nginx (host process), NOT docker/caddy.
# So Umami publishes a host port and nginx proxies to 127.0.0.1:8091.
# The DB stays on a private "internal" network, not published to the host.

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    init: true
    restart: unless-stopped
    ports:
      # host:container. 8091 free (8080/3012 already taken by vaultwarden).
      - "127.0.0.1:8091:3000"
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      # image ships curl (per upstream compose)
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
