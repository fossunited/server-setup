[app]
# Log level: info, debug, warn, error, fatal
log_level = "info"
# Environment: dev, prod.
env = "prod"
check_updates = true
# Encryption key. Generate using `openssl rand -hex 16`, must be 32 characters long.
encryption_key = "REPLACE_WITH_32_CHAR_KEY_______"

[app.server]
address = "0.0.0.0:9000"
socket = ""
disable_secure_cookies = false
session_lifetime = "9h"
read_timeout = "60s"
write_timeout = "60s"
max_body_size = 104857600
read_buffer_size = 65536
keepalive_timeout = "10s"

[upload]
provider = "fs"

[upload.fs]
upload_path = "uploads"
expiry = "1h"

[db]
host = "db"
port = 5432
user = "libredesk"
# Must match POSTGRES_PASSWORD in .env (compose sets the DB's actual password from there).
password = "REPLACE_WITH_POSTGRES_PASSWORD"
database = "libredesk"
ssl_mode = "disable"
max_open = 30
max_idle = 30
max_lifetime = "300s"

[redis]
address = "redis:6379"
user = ""
password = ""
db = 0

[message]
outgoing_queue_workers = 10
incoming_queue_workers = 10
message_outgoing_scan_interval = "50ms"
incoming_queue_size = 5000
outgoing_queue_size = 5000

[notification]
concurrency = 2
queue_size = 2000

[automation]
worker_count = 10

[ai_agent]
worker_count = 10
queue_size = 1000
max_steps = 6
max_history_messages = 30

[autoassigner]
autoassign_interval = "5m"

[webhook]
workers = 5
queue_size = 10000
timeout = "15s"

[ssrf]
# Self-hosted single-tenant deployment: leave disabled per upstream guidance.
enabled = false
allowed_cidrs = []

[conversation]
unsnooze_interval = "5m"
draft_retention_duration = "360h"
continuity_scan_interval = "5m"

[sla]
evaluation_interval = "5m"

[rate_limit.widget]
enabled = true
requests_per_minute = 100

[rate_limit.auth]
enabled = true
requests_per_minute = 30

[rate_limit.public]
enabled = true
requests_per_minute = 100

[rate_limit.media]
enabled = true
requests_per_minute = 300
