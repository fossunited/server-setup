# nginx site for Miniflux on the vaultwarden Linode.
# Install to /etc/nginx/sites-available/reader.fossunited.org, symlink into
# sites-enabled, then run certbot (see README). *.fossunited.org is HSTS
# (HTTPS-only) so the cert is mandatory.

server {
    server_name reader.fossunited.org;

    # feeds/OPML import can be large
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
