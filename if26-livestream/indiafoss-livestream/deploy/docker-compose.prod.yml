# ==============================================================================
# IndiaFOSS 2026 — Production Docker Compose Override
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# ==============================================================================

services:
  controller:
    environment:
      - RELOAD=false
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - HOST_NET_STATS_DIR=/host/netstats
    # !override drops the base file's source-code bind mount: production runs the code baked into the image
    volumes: !override
      - ../backend/config:/app/backend/config
      - ../dist:/app/dist:ro
      - ./secrets:/app/secrets:ro
      - ../telemetry:/app/telemetry
      # The host's own network counters (read-only) for bandwidth / data-sent figures
      - /sys/class/net/${HOST_NET_IF:-eth0}/statistics:/host/netstats:ro
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mediamtx:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  edge:
    # !override replaces the base file's 8080 mapping instead of adding to it
    ports: !override
      - "${EDGE_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
